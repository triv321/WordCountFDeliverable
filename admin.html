<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB Pro - Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0066FF;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0066FF;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, button {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            background: white;
        }

        button {
            background: #0066FF;
            color: white;
            border-color: #0066FF;
            transition: all 0.3s;
        }

        button:hover {
            background: #0052CC;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-new {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-contacted {
            background: #fff3e0;
            color: #f57c00;
        }

        .status-completed {
            background: #e8f5e9;
            color: #388e3c;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .action-btn {
            padding: 5px 12px;
            font-size: 0.85rem;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 PCB Pro - Admin Dashboard</h1>
            <p>Manage contacts, view statistics, and track analytics</p>
        </header>

        <div id="message"></div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalContacts">-</div>
                <div class="stat-label">Total Contacts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="newContacts">-</div>
                <div class="stat-label">New Contacts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalProjects">-</div>
                <div class="stat-label">Total Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalEvents">-</div>
                <div class="stat-label">Analytics Events</div>
            </div>
        </div>

        <!-- Contacts Section -->
        <div class="section">
            <h2>Contact Submissions</h2>
            <div class="filters">
                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="new">New</option>
                    <option value="contacted">Contacted</option>
                    <option value="completed">Completed</option>
                </select>
                <button onclick="loadContacts()">Refresh</button>
                <button onclick="exportContacts()">Export CSV</button>
            </div>
            <div id="contactsTable">
                <div class="loading">Loading contacts...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000';

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_URL}/api/stats`);
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;
                    
                    // Calculate total contacts
                    const totalContacts = Object.values(stats.contacts_by_status).reduce((a, b) => a + b, 0);
                    document.getElementById('totalContacts').textContent = totalContacts;
                    
                    // New contacts
                    document.getElementById('newContacts').textContent = stats.contacts_by_status.new || 0;
                    
                    // Projects
                    document.getElementById('totalProjects').textContent = stats.total_projects;
                    
                    // Events
                    document.getElementById('totalEvents').textContent = stats.total_events;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
                showMessage('Error loading statistics. Make sure the API server is running.', 'error');
            }
        }

        // Load contacts
        async function loadContacts() {
            const statusFilter = document.getElementById('statusFilter').value;
            const tableDiv = document.getElementById('contactsTable');
            
            tableDiv.innerHTML = '<div class="loading">Loading contacts...</div>';

            try {
                let url = `${API_URL}/api/contacts`;
                if (statusFilter) {
                    url += `?status=${statusFilter}`;
                }

                const response = await fetch(url);
                const data = await response.json();

                if (data.success && data.contacts.length > 0) {
                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Company</th>
                                    <th>Message</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    data.contacts.forEach(contact => {
                        const date = new Date(contact.created_at).toLocaleDateString();
                        html += `
                            <tr>
                                <td>${contact.id}</td>
                                <td>${contact.name}</td>
                                <td>${contact.email}</td>
                                <td>${contact.company}</td>
                                <td>${contact.message.substring(0, 50)}...</td>
                                <td><span class="status-badge status-${contact.status}">${contact.status}</span></td>
                                <td>${date}</td>
                                <td>
                                    <button class="action-btn" onclick="updateStatus(${contact.id}, 'contacted')">Mark Contacted</button>
                                    <button class="action-btn" onclick="updateStatus(${contact.id}, 'completed')">Mark Completed</button>
                                </td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table>';
                    tableDiv.innerHTML = html;
                } else {
                    tableDiv.innerHTML = '<p class="loading">No contacts found.</p>';
                }
            } catch (error) {
                console.error('Error loading contacts:', error);
                tableDiv.innerHTML = '<div class="error">Error loading contacts. Make sure the API server is running.</div>';
            }
        }

        // Update contact status
        async function updateStatus(contactId, newStatus) {
            try {
                const response = await fetch(`${API_URL}/api/contacts/${contactId}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Contact status updated successfully!', 'success');
                    loadContacts();
                    loadStats();
                } else {
                    showMessage('Error: ' + data.error, 'error');
                }
            } catch (error) {
                console.error('Error updating status:', error);
                showMessage('Error updating contact status.', 'error');
            }
        }

        // Export contacts
        function exportContacts() {
            showMessage('Export functionality would download contacts as CSV', 'success');
        }

        // Show message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.className = type;
            messageDiv.textContent = text;
            
            setTimeout(() => {
                messageDiv.className = '';
                messageDiv.textContent = '';
            }, 5000);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadContacts();
        });

        // Refresh data every 30 seconds
        setInterval(() => {
            loadStats();
        }, 30000);
    </script>
</body>
</html>
